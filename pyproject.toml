[project]
name = "agentcy"
version = "0.3.0"
description = "Local MCP conversation bridge for agent chats in desktop apps and CLIs"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = ["mcp>=2.3,<3", "sqlalchemy>=2.0,<2.1", "alembic>=1.16,<2", "pydantic>=2.11,<3", "uvicorn>=0.31,<1"]

[project.scripts]
agentcy = "agentcy.tools.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff",
    "pip-audit",
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 100
# Sample code shown in the tutorial videos, not part of agentcy.
extend-exclude = ["docs/videos/sample"]

[tool.pytest.ini_options]
testpaths = ["tests", "docs/videos/tools"]

[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"docs/videos/tools/test_*.py" = ["S101"]
