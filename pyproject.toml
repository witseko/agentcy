# Python is used only for tests: the end-to-end tests in tests/e2e drive the Go binary
# through the MCP SDK, and docs/videos/tools holds the tutorial video tools.
[project]
name = "agentcy"
# Not the release version: the VERSION file holds that.
version = "0.0.0"
description = "End-to-end tests and tutorial video tools for agentcy"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = ["mcp>=2.3,<3", "pydantic>=2.11,<3"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff",
    "pip-audit",
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 100
# Tutorial sample code and transcript capture scripts are not part of agentcy.
extend-exclude = ["docs/videos/sample", "protocol/mcp-transcripts"]

[tool.pytest.ini_options]
# The end-to-end tests need AGENTCY_BIN and AGENTCY_CORE_CMD, so run them explicitly:
# pytest tests/e2e (see docs/development.md).
testpaths = ["docs/videos/tools"]

[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"docs/videos/tools/test_*.py" = ["S101"]
