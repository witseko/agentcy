[project]
name = "agents-chat"
version = "0.1.0"
description = "Local MCP conversation bridge for desktop agents"
requires-python = ">=3.12,<3.15"
dependencies = ["mcp>=1.26,<2", "sqlalchemy>=2.0,<2.1", "alembic>=1.16,<2", "pydantic>=2.11,<3"]

[project.scripts]
agents-chat = "agents_chat.tools.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff", "pip-audit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["S"]
